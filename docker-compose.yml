services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pramaan-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pramaan
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: